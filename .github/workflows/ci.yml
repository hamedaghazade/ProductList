name: CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Lint & Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: product_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/backend/prisma/schema.prisma
        env:
          DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/product_test_db?schema=public"

      - name: Push Database Schema for Testing
        run: npx prisma db push --schema=apps/backend/prisma/schema.prisma
        env:
          DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/product_test_db?schema=public"

      - name: Type Check & Build Shared Packages
        run: npm run build --workspaces --if-present

      - name: Run Test Suites
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/product_test_db?schema=public"
          BOT_TOKEN: "123456789:AAFakeTokenForCiWorkflowRunOnlyTest"
          TELEGRAM_WEBAPP_URL: "http://localhost:5173"
          ALLOW_DEV_AUTH_BYPASS: "false"

  docker-build-check:
    name: Validate Docker Builds
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.web
          push: false

      - name: Build Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
