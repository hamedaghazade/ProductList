version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: productlist_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-productlist}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-productlist}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - productlist_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: productlist_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-productlist}?schema=public
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is required}
      TELEGRAM_WEBAPP_URL: ${TELEGRAM_WEBAPP_URL:?TELEGRAM_WEBAPP_URL is required}
      ALLOW_DEV_AUTH_BYPASS: "false"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: "/usr/bin/chromium-browser"
    ports:
      - "3000:3000"
    networks:
      - productlist_net

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: productlist_web
    restart: always
    ports:
      - "80:80"
    networks:
      - productlist_net

volumes:
  pgdata:

networks:
  productlist_net:
    driver: bridge
